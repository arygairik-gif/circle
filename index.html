/* Responsive account experience: split-panel desktop, compact focused mobile. */
.cloud-gate{position:fixed;inset:0;z-index:100;background:#eeeee7;display:grid;place-items:center;padding:28px;overflow:auto}

.orbit-one{width:360px;height:130px;left:0;bottom:26px}

.dot-one{left:44px;bottom:71px}.dot-two{left:174px;bottom:120px;background:#d58f75}.dot-three{left:278px;bottom:55px;background:#d0b46c;color:#604c23}

async function startVoiceRecording(){

  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw new Error('Voice recording is not supported in this browser.');

   if(voiceLimitTimer){clearTimeout(voiceLimitTimer);voiceLimitTimer=null}
   voiceBlob=new Blob(voiceChunks,{type:voiceRecorder?.mimeType||'audio/webm'});
   voiceStream?.getTracks().forEach(t=>t.stop());voiceStream=null;
   if(voicePreviewUrl)URL.revokeObjectURL(voicePreviewUrl);
   voicePreviewUrl=URL.createObjectURL(voiceBlob);
   const preview=$('#voicePreview');if(preview){preview.src=voicePreviewUrl;preview.hidden=false}
   const status=$('#voiceStatus');
   if(!voiceBlob.size){if(status)status.textContent='No audio was captured. Check microphone permission and try again.'}
   else if(voiceBlob.size>300*1024){if(status)status.textContent='This recording is over the free 300 KB limit. Record a shorter note and try again.'}
   else if(status)status.textContent='Recording ready. Listen before sharing it.';
   const send=$('#voiceSend');if(send){send.hidden=!voiceBlob.size||voiceBlob.size>300*1024;send.disabled=false}
   const start=$('#voiceStart');if(start){start.hidden=false;start.disabled=false;start.textContent='Record again'}
   const stop=$('#voiceStop');if(stop)stop.disabled=true;
  };

async function runDeviceCheck(kind){
 stopDeviceCheck();
 const status=$('#deviceCheckStatus'),video=$('#deviceCameraPreview'),fallback=$('#devicePreviewFallback');
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('This browser cannot access devices here. Open Circle on localhost or HTTPS.');
  deviceStream=await navigator.mediaDevices.getUserMedia(kind==='camera'?{video:true}:{audio:true});
  if(kind==='camera'){if(video){video.srcObject=deviceStream;video.hidden=false}if(fallback)fallback.hidden=true;if(status)status.textContent='Camera ready. This is a private preview on your device.'}
  else if(status)status.textContent='Microphone permission granted. Your mic is active only for this local check.';
 }catch(e){if(status)status.textContent=e.name==='NotAllowedError'?'Permission was blocked. Allow camera or microphone access in your browser settings, then try again.':(e.message||'Could not access that device.')}
}
function stopDeviceCheck(){
 if(deviceStream){deviceStream.getTracks().forEach(track=>track.stop());deviceStream=null}
 const video=$('#deviceCameraPreview'),fallback=$('#devicePreviewFallback');
 if(video){video.pause?.();video.srcObject=null;video.hidden=true}
 if(fallback)fallback.hidden=false;
}
