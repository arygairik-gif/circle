let voiceRecorder=null,voiceStream=null,voiceChunks=[],voiceBlob=null,voicePreviewUrl='',voiceLimitTimer=null;
function openVoiceNote(){
 voiceChunks=[];voiceBlob=null;
 openModal('Record a voice note','Record a short audio message for your circle.',`<div class="question-box" id="voiceStatus">Your microphone will only be used after you press Start recording.</div><audio id="voicePreview" controls hidden style="width:100%;margin:12px 0"></audio><div class="modal-actions"><button class="soft-btn" data-action="close-modal">Cancel</button><button class="soft-btn" id="voiceStop" data-action="stop-recording" disabled>Stop</button><button class="primary-btn" id="voiceStart" data-action="start-recording">Start recording</button><button class="primary-btn" id="voiceSend" data-action="send-voice" hidden>Send voice note</button></div>`);
}
async function startVoiceRecording(){
 try{
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw new Error('Voice recording is not supported in this browser.');
  voiceStream=await navigator.mediaDevices.getUserMedia({audio:true});
  voiceChunks=[];voiceBlob=null;
  const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(x=>MediaRecorder.isTypeSupported(x));
  voiceRecorder=mime?new MediaRecorder(voiceStream,{mimeType:mime}):new MediaRecorder(voiceStream);
  voiceRecorder.ondataavailable=e=>{if(e.data?.size)voiceChunks.push(e.data)};
  voiceRecorder.onstop=()=>{
   if(voiceLimitTimer){clearTimeout(voiceLimitTimer);voiceLimitTimer=null}
   voiceBlob=new Blob(voiceChunks,{type:voiceRecorder?.mimeType||'audio/webm'});
   voiceStream?.getTracks().forEach(t=>t.stop());voiceStream=null;
   if(voicePreviewUrl)URL.revokeObjectURL(voicePreviewUrl);
   voicePreviewUrl=URL.createObjectURL(voiceBlob);
   const preview=$('#voicePreview');if(preview){preview.src=voicePreviewUrl;preview.hidden=false}
   const status=$('#voiceStatus');if(status)status.textContent='Recording ready. Listen before sharing it.';
   const send=$('#voiceSend');if(send)send.hidden=false;
   const start=$('#voiceStart');if(start){start.hidden=false;start.disabled=false;start.textContent='Record again'}
   const stop=$('#voiceStop');if(stop)stop.disabled=true;
  };
  voiceRecorder.start();
  $('#voiceStatus').textContent='Recording… the note will stop automatically after 8 seconds.';
  voiceLimitTimer=setTimeout(()=>{if(voiceRecorder?.state==='recording')voiceRecorder.stop()},8000);
  $('#voiceStart').disabled=true;$('#voiceStop').disabled=false;
 }catch(e){const status=$('#voiceStatus');if(status)status.textContent=e.message||'Could not access the microphone.'}
}
function stopVoiceRecording(){if(voiceRecorder&&voiceRecorder.state==='recording')voiceRecorder.stop()}
async function sendVoiceNote(){
 if(!voiceBlob){toast('Record a voice note first.');return}
 const ext=(voiceBlob.type||'audio/webm').includes('mp4')?'m4a':(voiceBlob.type||'audio/webm').includes('ogg')?'ogg':'webm';
 const file=new File([voiceBlob],`voice-note-${Date.now()}.${ext}`,{type:voiceBlob.type||'audio/webm'});
 const send=$('#voiceSend');if(send)send.disabled=true;
 try{await window.CircleCloud.sendAttachment(file);toast('Voice note shared and saved to Memory Vault.');closeModal();pendingChatBottom=true}
 catch(e){if(send)send.disabled=false;const status=$('#voiceStatus');if(status)status.textContent='Upload failed: '+(e.code||e.message)}
}

function closeModal(){const root=$('#modalRoot');if(!root)return;if(voiceLimitTimer){clearTimeout(voiceLimitTimer);voiceLimitTimer=null}if(voiceRecorder?.state==='recording')voiceRecorder.stop();voiceStream?.getTracks().forEach(t=>t.stop());voiceStream=null;const hadModal=!!root.firstElementChild;root.innerHTML='';if(hadModal&&lastModalFocus?.isConnected)lastModalFocus.focus()}

 if(type==='hangout'){openHangout();return}if(type==='support'){openSupport();return}if(type==='quests'){setView('today');return}if(type==='rituals'){openRitual();return}if(type==='daily-drop'){openDailyDrop();return}if(type==='awards'){const wins=[`${state.plans.length} plans started`,`${state.memories.length} memories saved`,`${state.quests.filter(q=>q.done).length} quests completed`,`${state.rituals.length} rituals created`];openModal('Group little wins','A small celebration of what your circle has actually shared.',`<div class="answer-list">${wins.map(x=>`<div class="poll-option">✳ ${escapeHtml(x)}</div>`).join('')}</div><p class="card-caption">These counts come from your circle’s shared data, not a leaderboard.</p><div class="modal-actions"><button class="primary-btn" data-action="close-modal">Lovely</button></div>`);return}if(type==='stats'){openModal('Your circle, in tiny numbers','A live snapshot of what your group has shared.',`<div class="member-grid"><div class="card card-pad"><strong>${state.messages.length}</strong><div class="card-caption">recent messages loaded</div></div><div class="card card-pad"><strong>${state.plans.length}</strong><div class="card-caption">plans</div></div><div class="card card-pad"><strong>${state.members.length}</strong><div class="card-caption">members</div></div><div class="card card-pad"><strong>${state.memories.length}</strong><div class="card-caption">memories</div></div><div class="card card-pad"><strong>${state.quests.filter(q=>q.done).length}/${state.quests.length}</strong><div class="card-caption">quests completed</div></div><div class="card card-pad"><strong>${state.rituals.length}</strong><div class="card-caption">rituals</div></div></div><p class="field-hint">Counts reflect data currently loaded from your circle.</p><div class="modal-actions"><button class="primary-btn" data-action="close-modal">Done</button></div>`);return}

 if(f.id==='activityForm'){const type=f.dataset.type;if(window.CircleCloud){const meta={'time-capsule':{type:'time-capsule',title:'A sealed time capsule',icon:'⌛',color:'link',unlockAt:data.unlock},playlist:{type:'link',title:'A song for the circle',icon:'♫',color:'link'},adventure:{type:'milestone',title:'A shared adventure',icon:'🧭',color:'link'},stickers:{type:'milestone',title:'A sticker idea for the circle',icon:'✳',color:'link'},appreciation:{type:'milestone',title:'A little appreciation',icon:'💛',color:'link'},'deep-questions':{type:'milestone',title:'A circle conversation note',icon:'💭',color:'link'},'know-me':{type:'milestone',title:'Know Me answer',icon:'💭',color:'link'}}[type]||{type:'milestone',title:'Circle activity',icon:'✳',color:'link'};window.CircleCloud.addMemory({...meta,desc:data.answer}).then(()=>window.CircleCloud.addActivity({type,answer:data.answer,unlock:data.unlock,title:meta.title})).then(()=>{closeModal();setView('memories');toast('Saved and shared with your circle.')}).catch(e=>toast('Activity not saved: '+(e.code||e.message)));return}if(type==='time-capsule'){state.memories.unshift({id:Date.now(),type:'milestone',icon:'⌛',title:'A sealed time capsule',desc:data.answer,date:todayISO(),by:'You',color:'link'});toast(`Capsule saved locally. Unlock target: ${data.unlock}.`)}else if(type==='playlist'){state.memories.unshift({id:Date.now(),type:'link',icon:'♫',title:'A song for the circle',desc:data.answer,date:todayISO(),by:'You',color:'link'});toast('Added to your local circle playlist.')}else if(type==='adventure'){state.memories.unshift({id:Date.now(),type:'milestone',icon:'🧭',title:'A shared adventure',desc:data.answer,date:todayISO(),by:'You',color:'link'});toast('Adventure saved to your memories.')}else if(type==='stickers'){state.memories.unshift({id:Date.now(),type:'milestone',icon:'✳',title:'A sticker idea for the circle',desc:data.answer,date:todayISO(),by:'You',color:'link'});toast('Sticker idea saved locally.')}else{state.memories.unshift({id:Date.now(),type:'milestone',icon:type==='appreciation'?'💛':'💭',title:type==='appreciation'?'A little appreciation':'A circle conversation note',desc:data.answer,date:todayISO(),by:'You',color:'link'});toast('Saved to your circle memories.')}save();closeModal();if(type==='playlist'||type==='time-capsule'||type==='appreciation'||type==='adventure'||type==='stickers')setView('memories');return}

root.addEventListener('input',e=>{if(e.target.id==='memorySearch'){const value=e.target.value;const start=e.target.selectionStart;const end=e.target.selectionEnd;memoryQuery=value;render();const next=$('#memorySearch');next?.focus();next?.setSelectionRange(start,end)}});
root.addEventListener('change',e=>{if(e.target.id==='attachmentInput'){const file=e.target.files?.[0];if(file){if(!window.CircleCloud?.sendAttachment){toast('Sign in and open a circle before uploading.');e.target.value='';return}const input=e.target;window.CircleCloud.sendAttachment(file).then(r=>{toast(r.type==='image'?'Photo shared and saved to Memory Vault.':'Audio shared and saved to Memory Vault.');pendingChatBottom=true}).catch(x=>toast('Upload failed: '+(x.code||x.message)));input.value=''}return}if(e.target.id==='quietStart'||e.target.id==='quietEnd'){state.settings[e.target.id]=e.target.value;save();toast('Quiet hours updated.');return}});
root.addEventListener('keydown',e=>{const dialog=$('#modalRoot .modal');if(e.key==='Tab'&&dialog){const focusable=$$('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),a[href]',dialog).filter(el=>el.offsetParent!==null);if(focusable.length){const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}if(e.target.id==='messageInput'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('[data-action="send-message"]')?.click()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch')?.focus()}if(e.key==='Escape')closeModal()});
$('#globalSearchForm').addEventListener('submit',e=>{e.preventDefault();const query=$('#globalSearch').value.trim();if(query)openSearch(query)});
