.dot-one{left:44px;bottom:71px}.dot-two{left:174px;bottom:120px;background:#d58f75}.dot-three{left:278px;bottom:55px;background:#d0b46c;color:#604c23}

/* Circle editorial refresh — warm paper, quiet green, clearer hierarchy */
:root{
 --paper:#f7f6f1;--surface:#fffefa;--surface-2:#f1f0e9;--ink:#242820;--muted:#777b70;
 --line:#e6e4da;--green:#56785a;--green-dark:#3e5c42;--green-soft:#e9efe5;
 --orange:#c98160;--shadow:0 10px 28px rgba(39,45,34,.045);--radius:17px;
}
html,body{background:var(--paper);color:var(--ink)}
.app{grid-template-columns:258px minmax(0,1fr);max-width:1900px}
.sidebar{background:#faf9f5;border-right-color:#e8e6dd;padding:30px 18px 20px}

.nav-link:hover{background:#f0f0e9}
.circle-mini{background:#f0efe8;border:1px solid #e8e6dc}

.main-shell{background:var(--paper)}
.topbar{height:72px;background:rgba(250,249,245,.94);border-bottom-color:#e8e6dd;padding:0 34px}
.searchbox{background:#fffefa;border-radius:9px;border-color:#e7e5dc;height:39px}
.content-grid{max-width:1600px;padding:32px 36px 48px;gap:26px;grid-template-columns:minmax(0,1fr) 280px}
.page-head{margin:0 0 24px;align-items:flex-end}
.eyebrow{font-size:9px;letter-spacing:1.8px;color:#668067}
.page-title{font:400 34px/1.08 'DM Serif Display',Georgia,serif;letter-spacing:-.6px}
.page-subtitle{font-size:12px;line-height:1.65;color:#777b70;max-width:560px}
.card{border-radius:16px;box-shadow:none;border-color:#e8e6dd}
.primary-btn{background:#526f53;border-radius:9px;box-shadow:none;padding:11px 15px;font-size:11px}
.primary-btn:hover{background:#3e5c42}

async function startVoiceRecording(){
 try{
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw new Error('Voice recording is not supported in this browser.');
  voiceStream=await navigator.mediaDevices.getUserMedia({audio:true});
  voiceChunks=[];voiceBlob=null;
  const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(x=>MediaRecorder.isTypeSupported(x));
  voiceRecorder=mime?new MediaRecorder(voiceStream,{mimeType:mime}):new MediaRecorder(voiceStream);
  voiceRecorder.ondataavailable=e=>{if(e.data?.size)voiceChunks.push(e.data)};
  voiceRecorder.onstop=()=>{
   if(voiceLimitTimer){clearTimeout(voiceLimitTimer);voiceLimitTimer=null}
   voiceBlob=new Blob(voiceChunks,{type:voiceRecorder?.mimeType||'audio/webm'});
   voiceStream?.getTracks().forEach(t=>t.stop());voiceStream=null;
   if(voicePreviewUrl)URL.revokeObjectURL(voicePreviewUrl);
   voicePreviewUrl=URL.createObjectURL(voiceBlob);
   const preview=$('#voicePreview');if(preview){preview.src=voicePreviewUrl;preview.hidden=false}
   const status=$('#voiceStatus');
   if(!voiceBlob.size){if(status)status.textContent='No audio was captured. Check microphone permission and try again.'}
   else if(voiceBlob.size>300*1024){if(status)status.textContent='This recording is over the free 300 KB limit. Record a shorter note and try again.'}
   else if(status)status.textContent='Recording ready. Listen before sharing it.';
   const send=$('#voiceSend');if(send){send.hidden=!voiceBlob.size||voiceBlob.size>300*1024;send.disabled=false}
   const start=$('#voiceStart');if(start){start.hidden=false;start.disabled=false;start.textContent='Record again'}
   const stop=$('#voiceStop');if(stop)stop.disabled=true;
  };
  voiceRecorder.start();
  $('#voiceStatus').textContent='Recording… the note will stop automatically after 8 seconds.';
  voiceLimitTimer=setTimeout(()=>{if(voiceRecorder?.state==='recording')voiceRecorder.stop()},8000);
  $('#voiceStart').disabled=true;$('#voiceStop').disabled=false;
 }catch(e){voiceStream?.getTracks().forEach(t=>t.stop());voiceStream=null;const status=$('#voiceStatus');if(status)status.textContent=e.name==='NotAllowedError'?'Microphone permission was blocked. Allow microphone access in your browser settings and try again.':(e.message||'Could not access the microphone.')}
}

function homeStamp(value){
 if(!value)return 0;
 if(typeof value.toMillis==='function')return value.toMillis();
 if(typeof value.seconds==='number')return value.seconds*1000;
 if(value instanceof Date)return value.getTime();
 const parsed=Date.parse(value);return Number.isFinite(parsed)?parsed:0;
}
function homeActivityItems(){
 const items=[];
 const messages=Array.isArray(state.messages)?state.messages:[];
 messages.slice(-35).forEach((m,index)=>{
  const stamp=homeStamp(m.createdAt)||homeStamp(m.day)||Date.now()-((messages.length-index)*1200);
  const actor=m.from==='you'?(state.me.displayName||'You'):(m.senderName||person(m.from).name||'A member');
  const detail=m.text||(m.image?'Shared a photo':m.audio?'Shared a voice note':m.sticker?'Shared a sticker':'Shared something with the circle');
  items.push({view:'chat',stamp,actor,title:'sent a message',detail:String(detail).slice(0,100),when:m.time||'Recently',icon:'↗'});
 });
 (Array.isArray(state.plans)?state.plans:[]).forEach(p=>{
  const stamp=homeStamp(p.createdAt);
  items.push({view:'plans',stamp,actor:person(p.uid).name||'Your circle',title:'added a plan',detail:p.title||'A new group plan',when:stamp?new Intl.DateTimeFormat('en',{month:'short',day:'numeric'}).format(new Date(stamp)):'Plan',icon:'▦'});
 });
 (Array.isArray(state.memories)?state.memories:[]).forEach(m=>{
  const stamp=homeStamp(m.createdAt)||homeStamp(m.date);
  items.push({view:'memories',stamp,actor:m.by||person(m.uid).name||'A member',title:'saved a memory',detail:m.title||m.desc||'A little moment worth keeping',when:stamp?new Intl.DateTimeFormat('en',{month:'short',day:'numeric'}).format(new Date(stamp)):'Memory',icon:m.icon||'▧'});
 });
 (Array.isArray(state.activities)?state.activities:[]).forEach(a=>{
  const stamp=homeStamp(a.createdAt);
  items.push({view:'activities',stamp,actor:person(a.uid).name||'A member',title:a.type==='daily-drop'?'answered the Daily Drop':'shared an update',detail:a.title||a.answer||a.type||'Circle activity',when:stamp?new Intl.DateTimeFormat('en',{month:'short',day:'numeric'}).format(new Date(stamp)):'Activity',icon:'✳'});
 });
 return items.sort((a,b)=>b.stamp-a.stamp).slice(0,4);
}

function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(s){return escapeHtml(s).replace(/`/g,'&#96;')}
function openModal(title,subtitle,body,icon='✳'){lastModalFocus=document.activeElement;const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDescription" tabindex="-1"><div class="modal-head"><div><h2 id="modalTitle">${escapeHtml(title)}</h2><p id="modalDescription">${escapeHtml(subtitle)}</p></div><button class="modal-close" data-action="close-modal" aria-label="Close dialog">✕</button></div>${body}</section></div>`;const first=root.querySelector('input:not([type=hidden]),textarea,select,button');(first||root.querySelector('.modal'))?.focus()}
function closeModal(){const root=$('#modalRoot');if(!root)return;if(voiceLimitTimer){clearTimeout(voiceLimitTimer);voiceLimitTimer=null}if(voiceRecorder?.state==='recording')voiceRecorder.stop();voiceStream?.getTracks().forEach(t=>t.stop());voiceStream=null;stopDeviceCheck();if(pendingPhotoUrl){URL.revokeObjectURL(pendingPhotoUrl);pendingPhotoUrl='';pendingPhotoFile=null}const hadModal=!!root.firstElementChild;root.innerHTML='';if(hadModal&&lastModalFocus?.isConnected)lastModalFocus.focus()}

async function saveQuickMemory(button){
 const form=$('#quickMemoryForm');if(!form)return;
 const data=Object.fromEntries(new FormData(form).entries()),title=String(data.title||'').trim(),desc=String(data.desc||'').trim();
 if(!title){$('#quickMemoryTitle')?.focus();toast('Give your memory a name first.');return}
 button.disabled=true;button.textContent='Saving…';
 try{
  if(window.CircleCloud?.addMemory)await window.CircleCloud.addMemory({type:'milestone',icon:'✳',title,desc,color:'link'});
  else{state.memories.unshift({id:Date.now(),type:'milestone',icon:'✳',title,desc,date:todayISO(),by:state.me.displayName||'You',color:'link'});save()}
  closeModal();setView('memories');toast('Memory saved to your circle.');
 }catch(error){button.disabled=false;button.textContent='Save memory';toast('Memory not saved: '+(error.code||error.message||'Try again.'))}
}
